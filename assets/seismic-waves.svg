<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="t d">
<title id="t">How seismic waves move</title><desc id="d">Conceptual diagrams of compressional P waves, transverse S waves, and surface waves.</desc>
<rect width="1200" height="440" rx="22" fill="#f5f7fa"/>
<text x="52" y="55" fill="#17283b" font-family="Arial" font-size="27" font-weight="700">Three ways seismic energy moves</text>
<text x="52" y="83" fill="#607589" font-family="Arial" font-size="15">Conceptual particle motion · not to scale · propagation direction shown left to right</text>
<g font-family="Arial" fill="#17314a">
<text x="55" y="145" font-size="22" font-weight="700">P wave · compression</text><text x="55" y="170" font-size="14" fill="#607589">Particles oscillate parallel to travel</text>
<text x="55" y="265" font-size="22" font-weight="700">S wave · shear</text><text x="55" y="290" font-size="14" fill="#607589">Particles move perpendicular to travel</text>
<text x="55" y="385" font-size="22" font-weight="700">Surface waves</text><text x="55" y="410" font-size="14" fill="#607589">Motion travels along the ground surface</text>
</g>
<g transform="translate(430 0)">
